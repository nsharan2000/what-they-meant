)</text><text x="1055.0" y="138.0" class="t2">A: should ask · B: should act · multi-turn</text><text x="1047" y="180" class="drop" text-anchor="end">−8 near-duplicates</text><line x1="1055" y1="153" x2="1055" y2="200" class="ar" marker-end="url(#m)"/><text x="1063.0" y="180.5" class="cnt" text-anchor="start">58 pairs</text><polygon points="1055,202.0 1160.0,250 1055,298.0 950.0,250" fill="#e4f2e9" stroke="#2f7d4f" stroke-width="1.6"/><text x="1055" y="248" class="t1">Human review</text><text x="1055" y="265" class="t2">full · variant · park</text><text x="1166" y="254" class="drop" text-anchor="start">−13</text><line x1="1055" y1="298" x2="1055" y2="340" class="ar" marker-end="url(#m)"/><text x="1063.0" y="323.0" class="cnt" text-anchor="start">45 pairs</text><rect x="905" y="340" width="300" height="52" rx="8" fill="#e5edf9" stroke="#2b5fa8" stroke-width="1.6"/><text x="1055.0" y="362.0" class="t1">Pushback variants</text><text x="1055.0" y="380.0" class="t2">+3 conversations where the user insists</text><line x1="1055" y1="392" x2="1055" y2="430" class="ar" marker-end="url(#m)"/><rect x="905" y="430" width="300" height="62" rx="8" fill="#c9ebd3" stroke="#2f7d4f" stroke-width="2.4"/><text x="1055.0" y="457.0" class="t1">Final dataset</text><text x="1055.0" y="475.0" class="t2">45 pairs · 93 conversations</text><rect x="905" y="506" width="300" height="38" rx="8" fill="none" stroke="#9a9a9a" stroke-dasharray="5 4"/><text x="1055" y="530" class="t2" fill="#555">→ used as seeds for the What They Meant environment</text><rect x="20" y="578" width="18" height="14" rx="3" fill="#e4f2e9" stroke="#2f7d4f"/><text x="46" y="590" class="lg">Human</text><rect x="170" y="578" width="18" height="14" rx="3" fill="#e5edf9" stroke="#2b5fa8"/><text x="196" y="590" class="lg">Model (LLM)</text><rect x="320" y="578" width="18" height="14" rx="3" fill="#eeeeee" stroke="#5a5a5a"/><text x="346" y="590" class="lg">Code / data</text><polygon points="479,578 488,585 479,592 470,585" fill="#